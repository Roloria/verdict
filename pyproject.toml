[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-verdict"
version = "0.12.0"
description = "A gate AI output has to walk through: every assertion is bound to a check a deterministic tool can run, with evidence, and a CI exit code. Fork of reverify (MIT) — reverify's binary claim protocol, aimed at reports, docs, diffs and generated code."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "2akouwu" }, { name = "Kevin Wang" }]
keywords = [
    "anti-hallucination", "hallucination", "grounding", "verification", "llm", "ai-agents",
    "context-engineering", "mcp", "reverse-engineering", "binary-analysis", "disassembler",
    "frida", "protobuf", "malware-analysis", "ctf",
    "ai-slop", "quality-gate", "ci", "code-review", "fact-check", "evidence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# Mature engines. The pure-Python core always works; these upgrade it in place.
capstone = ["capstone>=5.0"]   # full-fidelity disassembly (x86/x64/ARM/ARM64)
unicorn = ["unicorn>=2.0"]     # real CPU emulation
lief = ["lief>=0.14"]          # PE / ELF / Mach-O parsing
z3 = ["z3-solver>=4.12"]       # proof-grade expression equivalence (MBA deobfuscation)
angr = ["angr>=9.2"]           # semantic layer: function boundaries, call graph, xrefs (large; not in [full])
full = ["capstone>=5.0", "unicorn>=2.0", "lief>=0.14", "z3-solver>=4.12"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Roloria/verdict"
Repository = "https://github.com/Roloria/verdict"
Issues = "https://github.com/Roloria/verdict/issues"
Upstream = "https://github.com/2akouwu/reverify"

[project.scripts]
reverify = "reverify.cli:main"
reverify-mcp = "reverify.mcp_server:run_mcp_server"
verdict = "verdict.cli:main"
ai-verdict-mcp = "verdict.mcp_server:main"

[tool.setuptools]
packages = ["reverify", "reverify.tests", "verdict", "verdict.tests"]

[tool.setuptools.package-data]
reverify = ["py.typed", "plugins/opencode/*.js"]
verdict = ["rules/*.json", "data/*.json"]
